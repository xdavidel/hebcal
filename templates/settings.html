{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Settings</h2>
  <form method="post" class="entry-form">
    <label class="full">Timezone
      <select name="timezone">
        <option value="" {% if not saved_tz %}selected{% endif %}>System default ({{ system_tz }})</option>
        {% for tz in timezones %}
        <option value="{{ tz }}" {% if saved_tz == tz %}selected{% endif %}>{{ tz }}</option>
        {% endfor %}
      </select>
    </label>
    <p class="hint full">Currently using: <strong>{{ current_tz }}</strong></p>
    <button type="submit">Save</button>
  </form>
</section>

<section class="card">
  <h2>Home Assistant setup</h2>
  <p>Add the ICS Calendar integration (HACS) and point it at:</p>
  <pre>http://&lt;truenas-ip&gt;:8080/calendar.ics</pre>
  <p class="hint">Horizon: {{ horizon }} Hebrew years from today.</p>
</section>
{% endblock %}
